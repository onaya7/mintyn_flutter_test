name: mintyn
description: "Mintyn assesment test app"

# The following line prevents the package from being accidentally published to pub.dev.
publish_to: "none"

# The following defines the version and build number for your application.
version: 1.0.0+1

# The following line ensures that the package versions are locked to the versions
environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  delightful_toast: ^1.1.0
  device_preview: ^1.2.0
  dio: ^5.9.2
  dio_http_cache_fix: ^0.5.1
  dio_smart_retry: ^6.0.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.1.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.4
  get_it: ^8.0.0
  google_fonts: ^6.3.2
  hive_flutter: ^1.1.0
  injectable: ^2.4.4
  internet_connection_checker: ^1.0.0+1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.7.0
  page_transition: ^2.2.1
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.1
  shimmer: ^3.0.0
  uuid: ^4.5.0
  very_good_analysis: ^6.0.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.7.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  retrofit_generator: ^9.1.2

dependency_overrides:
  meta: ^1.14.0
  retrofit: ">=4.4.1 <4.9.0"
  retrofit_generator: ">=9.1.2 <9.2.0"

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - .env
